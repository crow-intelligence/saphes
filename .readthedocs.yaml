version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

# No `formats:` key. PDF and ePub are Sphinx-only on Read the Docs, so
# declaring them in an MkDocs project silently builds nothing and advertises
# downloads that 404.
