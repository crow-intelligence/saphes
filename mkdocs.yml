site_name: saphes
site_description: Readability (LIX) and lexical diversity (TTR/MATTR), made auditable
site_url: https://saphes.readthedocs.io
repo_url: https://github.com/crow-intelligence/saphes
repo_name: crow-intelligence/saphes

# Fail the build on any warning (broken links, missing autodoc targets, dead
# snippet paths). Keeps the published docs honest.
strict: true

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://crowintelligence.org/
      name: Crow Intelligence

theme:
  name: material
  logo: assets/saphes_logo.svg
  # A square mark for the favicon — the 550x150 banner letterboxes to nothing
  # at 16px, and the wordmark is unreadable there anyway.
  favicon: assets/saphes_mark.svg
  features:
    # The four Diátaxis modes are the top-level structure, so they get tabs.
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  # Pull the verified example scripts into the docs so they never drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# Organised by Diátaxis (https://diataxis.fr/): learning, tasks, information and
# understanding are four different needs, and a page that mixes them serves none.
nav:
  - Home: index.md
  - Tutorial:
      - tutorial/first-measurement.md
  - How-to guides:
      - Getting set up:
          - how-to/install.md
      - Measuring:
          - how-to/measure-hungarian-text.md
          - how-to/supply-a-sentence-count.md
          - how-to/compare-different-lengths.md
          - how-to/plug-in-a-sentence-splitter.md
          - how-to/count-letters-not-characters.md
          - how-to/stem-without-a-lemmatiser.md
      - Thresholds:
          - how-to/use-a-calibrated-threshold.md
          - how-to/calibrate-a-new-language.md
          - how-to/reproduce-the-calibration.md
      - When something looks wrong:
          - how-to/diagnose-a-surprising-result.md
          - how-to/match-another-implementation.md
  - Reference:
      - reference/index.md
      - API:
          - reference/readability.md
          - reference/diversity.md
          - reference/calibration.md
          - reference/segment.md
          - reference/hungarian.md
          - reference/stem.md
          - reference/datasets.md
      - Data:
          - reference/lix-bands.md
          - reference/calibration-data.md
          - reference/glossary.md
  - Explanation:
      - explanation/two-token-streams.md
      - explanation/stemming-is-not-lemmatisation.md
      - explanation/why-the-threshold-moves.md
      - explanation/what-a-hungarian-lix-score-means.md
      - explanation/why-implementations-disagree.md
      - explanation/what-gets-recorded.md
